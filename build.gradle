plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
    exclude '**/.cache'
}

repositories {
    // The NeoForged mirror intermittently serves *zero-byte* files with HTTP 200 for
    // third-party libraries. It is a CDN caching fault, not a local one. exclusiveContent
    // pins these groups to Central so the broken mirror is never consulted for them.
    //
    // Symptoms, so a future reader recognises it rather than debugging their own code:
    //   "Content is not allowed in prolog"               - an empty .pom parsed as XML
    //   "zip file is empty" / "zip END header not found" - an empty .jar
    // The giveaway is a Gradle cache directory named da39a3ee5e6b4b0d3255bfef95601890afd80709,
    // which is the SHA-1 of the empty string.
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.errorprone'
            includeGroup 'com.fasterxml.jackson'
            includeGroup 'org.apache.logging.log4j'
        }
    }

    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.x, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // The gametest server makes its world from minecraft:flat; this pack makes that Nauvis.
            programArguments.addAll '--packs', file('build/gametest-packs').getAbsolutePath()
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/client/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/server/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The game puts Gson on the classpath; the plain tests need it put there themselves.
    testImplementation 'com.google.code.gson:gson:2.14.0'
}

// The noise package is plain Java (CLAUDE.md, rule 6), so its tests are plain JUnit.
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

// Expands the ${} properties in src/main/templates into the built resources.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// MIT requires the notice to travel with every copy, and a jar is a copy.
tasks.named('jar', Jar) {
    from(project.file('LICENSE.txt')) {
        into('META-INF')
    }
}

// The gametest world: the world preset under minecraft:flat's name, which the gametest server uses.
var gameTestPacks = tasks.register('gameTestPacks', Sync) {
    into 'build/gametest-packs/nauvis_world'
    from 'src/gametest/nauvis_world'
    from('src/generated/server/data/nauvis_terrain/worldgen/world_preset/nauvis.json') {
        into 'data/minecraft/worldgen/world_preset'
        rename { 'flat.json' }
    }
}
tasks.matching { it.name == 'prepareGameTestServerRun' }.configureEach { dependsOn gameTestPacks }

// The noise program is generated (CLAUDE.md, rule 2): the generator's tests, then a diff of what
// it makes against the program on disk. Skipped when Wube's gitignored dump or locale is absent.
var checkTerrain = tasks.register('checkTerrain') {
    group = 'verification'
    description = 'Tests tools/gen_terrain.py and diffs the noise program it makes against the one on disk.'

    def root = projectDir
    def dumps = fileTree('reference/factorio') { include 'data-raw-*.json' }
    def locale = file('reference/factorio/locale/en/base.cfg')
    def coreLocale = file('reference/factorio/locale/en/core.cfg')
    inputs.files(fileTree('tools') { include '*.py' }, 'data/terrain.json', dumps)
            .withPropertyName('generator')
    outputs.upToDateWhen { false }

    doLast {
        if (dumps.isEmpty() || !locale.exists() || !coreLocale.exists()) {
            logger.lifecycle("checkTerrain: skipped, Factorio's dump or locale is absent from reference/factorio (reference/README.md)")
            return
        }
        [['-m', 'unittest', '-q', 'tools/test_gen_terrain.py'], ['tools/gen_terrain.py', '--check']].each { args ->
            // ProcessBuilder rather than exec {}, which is gone from task actions in Gradle 9.
            def process = new ProcessBuilder(['python'] + args).directory(root).redirectErrorStream(true).start()
            def output = process.inputStream.text
            logger.lifecycle(output)
            if (process.waitFor() != 0) {
                throw new GradleException('The noise program disagrees with the generator, or the generator with its tests. '
                        + 'Regenerate rather than edit by hand: python tools/gen_terrain.py --write')
            }
        }
    }
}
tasks.named('check') { dependsOn checkTerrain }
