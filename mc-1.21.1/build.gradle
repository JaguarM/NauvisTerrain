plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache'
}

repositories {
    // The NeoForged mirror intermittently serves *zero-byte* files with HTTP 200 for
    // third-party libraries. It is a CDN caching fault, not a local one. exclusiveContent
    // pins these groups to Central so the broken mirror is never consulted for them.
    //
    // Symptoms, so a future reader recognises it rather than debugging their own code:
    //   "Content is not allowed in prolog"               - an empty .pom parsed as XML
    //   "zip file is empty" / "zip END header not found" - an empty .jar
    // The giveaway is a Gradle cache directory named da39a3ee5e6b4b0d3255bfef95601890afd80709,
    // which is the SHA-1 of the empty string.
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.errorprone'
            includeGroup 'com.fasterxml.jackson'
            includeGroup 'org.apache.logging.log4j'
        }
    }

    mavenCentral()
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.21.1.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// core is compiled into this jar from its sources; the project dependency is there for the IDE.
configurations {
    coreJava {
        canBeConsumed = false
    }
    coreResources {
        canBeConsumed = false
    }
}

dependencies {
    compileOnly project(':core')
    coreJava project(path: ':core', configuration: 'coreJava')
    coreResources project(path: ':core', configuration: 'coreResources')
}

tasks.named('compileJava', JavaCompile) {
    source configurations.coreJava
}

tasks.named('processResources', ProcessResources) {
    from configurations.coreResources
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Its own directory, so the mods dropped into run/mods for play do not run with the
            // tests; gameTestWorld and gameTestStructures fill it.
            gameDirectory = file('run/gametest')
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('core/src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands the ${} properties in src/main/templates into the built resources.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// MIT requires the notice to travel with every copy, and a jar is a copy.
tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE.txt')) {
        into('META-INF')
    }
}

// Dynamic Trees looks for a mod's trees/ only in the first folder of a mod run from folders, the
// classes; in the jar it is at the root. This puts it beside the classes for runs in development.
var devTreePack = tasks.register('devTreePack', Sync) {
    dependsOn tasks.named('processResources')
    from 'build/resources/main/trees'
    into 'build/classes/java/main/trees'
}
tasks.matching { it.name in ['prepareClientRun', 'prepareServerRun', 'prepareGameTestServerRun'] }
        .configureEach { dependsOn devTreePack }
tasks.named('jar', Jar) { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

// The gametest world, made anew each run: the gametest server makes it from the minecraft:flat world
// preset and every datapack in it, and this one is the world preset under that name.
var gameTestWorld = tasks.register('gameTestWorld', Sync) {
    into 'run/gametest/world'
    from('src/gametest/nauvis_world') {
        into 'datapacks/nauvis_world'
    }
    from('src/generated/resources/data/nauvis_terrain/worldgen/world_preset/nauvis.json') {
        into 'datapacks/nauvis_world/data/minecraft/worldgen/world_preset'
        rename { 'flat.json' }
    }
}
// The one-block structure every test stands in, which a gametest server in development reads from here.
var gameTestStructures = tasks.register('gameTestStructures', Sync) {
    into 'run/gametest/gameteststructures'
    from 'src/gametest/structures'
}
tasks.matching { it.name == 'prepareGameTestServerRun' }.configureEach { dependsOn gameTestWorld, gameTestStructures }
