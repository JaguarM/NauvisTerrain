plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

// This version's Minecraft, NeoForge and Fabric versions.
def versions = new Properties()
file('../versions.properties').withInputStream { versions.load(it) }

version = mod_version
group = mod_group_id

repositories {
    // Central for these groups, never the NeoForged mirror (docs/PITFALLS.md, building).
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.errorprone'
            includeGroup 'com.fasterxml.jackson'
            includeGroup 'org.apache.logging.log4j'
        }
    }
    mavenCentral()
}

base {
    archivesName = "${mod_id}-neoforge-${versions.minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.21.1.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// core and this version's common are compiled into this jar from their sources; the project
// dependencies are there for the IDE.
configurations {
    sharedJava {
        canBeConsumed = false
    }
    sharedResources {
        canBeConsumed = false
    }
}

dependencies {
    compileOnly project(':core')
    compileOnly project(':mc-1.21.1:common')
    sharedJava project(path: ':core', configuration: 'coreJava')
    sharedJava project(path: ':mc-1.21.1:common', configuration: 'commonJava')
    sharedResources project(path: ':core', configuration: 'coreResources')
    sharedResources project(path: ':mc-1.21.1:common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    source configurations.sharedJava
}

tasks.named('processResources', ProcessResources) {
    from(configurations.sharedResources) {
        exclude '**/.cache'
    }
}

neoForge {
    version = versions.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Its own directory, so the mods dropped into run/mods for play do not run with the
            // tests; gameTestWorld and gameTestStructures fill it.
            gameDirectory = file('run/gametest')
        }

        // Datagen writes into common, whose data both of this version's mods carry.
        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('../common/src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('core/src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands the ${} properties in src/main/templates into the built resources.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : versions.minecraft_version,
            minecraft_version_range: versions.minecraft_version_range,
            neo_version            : versions.neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// MIT requires the notice to travel with every copy, and a jar is a copy.
tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE.txt')) {
        into('META-INF')
    }
}

// Dynamic Trees looks for a mod's trees/ only in the first folder of a mod run from folders, the
// classes; in the jar it is at the root. This puts it beside the classes for runs in development.
var devTreePack = tasks.register('devTreePack', Sync) {
    dependsOn tasks.named('processResources')
    from 'build/resources/main/trees'
    into 'build/classes/java/main/trees'
}
tasks.matching { it.name in ['prepareClientRun', 'prepareServerRun', 'prepareGameTestServerRun'] }
        .configureEach { dependsOn devTreePack }
tasks.named('jar', Jar) { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

// The gametest world, made anew each run: the gametest server makes it from the minecraft:flat world
// preset and every datapack in it, and this one is the world preset under that name.
var gameTestWorld = tasks.register('gameTestWorld', Sync) {
    // The server writes into the world after this, which Gradle does not count against it.
    outputs.upToDateWhen { false }
    into 'run/gametest/world'
    from('../common/src/gametest/nauvis_world') {
        into 'datapacks/nauvis_world'
    }
    from('../common/src/generated/resources/data/nauvis_terrain/worldgen/world_preset/nauvis.json') {
        into 'datapacks/nauvis_world/data/minecraft/worldgen/world_preset'
        rename { 'flat.json' }
    }
}
// The one-block structure every test stands in, which a gametest server in development reads from here.
var gameTestStructures = tasks.register('gameTestStructures', Sync) {
    into 'run/gametest/gameteststructures'
    from 'src/gametest/structures'
}
tasks.matching { it.name == 'prepareGameTestServerRun' }.configureEach { dependsOn gameTestWorld, gameTestStructures }
