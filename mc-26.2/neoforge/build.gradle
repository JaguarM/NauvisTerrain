plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

// This version's Minecraft, NeoForge and Fabric versions.
def versions = new Properties()
file('../versions.properties').withInputStream { versions.load(it) }

version = mod_version
group = mod_group_id

repositories {
    // Central for these groups, never the NeoForged mirror (docs/PITFALLS.md, building).
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.errorprone'
            includeGroup 'com.fasterxml.jackson'
            includeGroup 'org.apache.logging.log4j'
        }
    }
    mavenCentral()
}

base {
    archivesName = "${mod_id}-neoforge-${versions.minecraft_version}"
}

// Mojang ships Java 25 to end users in 26.x, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// core and this version's common are compiled into this jar from their sources; the project
// dependencies are there for the IDE.
configurations {
    sharedJava {
        canBeConsumed = false
    }
    sharedResources {
        canBeConsumed = false
    }
}

dependencies {
    compileOnly project(':core')
    compileOnly project(':mc-26.2:common')
    sharedJava project(path: ':core', configuration: 'coreJava')
    sharedJava project(path: ':mc-26.2:common', configuration: 'commonJava')
    sharedResources project(path: ':core', configuration: 'coreResources')
    sharedResources project(path: ':mc-26.2:common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    source configurations.sharedJava
}

tasks.named('processResources', ProcessResources) {
    from(configurations.sharedResources) {
        exclude '**/.cache'
    }
}

neoForge {
    version = versions.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // The gametest server makes its world from minecraft:flat; this pack makes that Nauvis.
            programArguments.addAll '--packs', file('build/gametest-packs').getAbsolutePath()
            // Its own directory, so the mods dropped into run/mods for play (Distant Horizons
            // crashes a gametest server) do not run with the tests.
            gameDirectory = file('run/gametest')
        }

        // Datagen writes into common, whose data both of this version's mods carry.
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('../common/src/generated/client/').getAbsolutePath(),
                    '--existing', rootProject.file('core/src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('../common/src/generated/server/').getAbsolutePath(),
                    '--existing', rootProject.file('core/src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Every version's runs have the same names; these keep their IDE configurations apart.
            it.ideName = "NeoForge ${versions.minecraft_version} ${it.name.capitalize()}"
            it.ideFolderName = "Minecraft ${versions.minecraft_version}"
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands the ${} properties in src/main/templates into the built resources.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : versions.minecraft_version,
            minecraft_version_range: versions.minecraft_version_range,
            neo_version            : versions.neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// MIT requires the notice to travel with every copy, and a jar is a copy.
tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE.txt')) {
        into('META-INF')
    }
}

// Dynamic Trees looks for a mod's trees/ only in the first folder of a mod run from folders, the
// classes; in the jar it is at the root. This puts it beside the classes for runs in development.
var devTreePack = tasks.register('devTreePack', Sync) {
    dependsOn tasks.named('processResources')
    from 'build/resources/main/trees'
    into 'build/classes/java/main/trees'
}
tasks.matching { it.name in ['prepareClientRun', 'prepareServerRun', 'prepareGameTestServerRun'] }
        .configureEach { dependsOn devTreePack }
tasks.named('jar', Jar) { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

// The gametest world: the world preset under minecraft:flat's name, which the gametest server uses.
var gameTestPacks = tasks.register('gameTestPacks', Sync) {
    into 'build/gametest-packs/nauvis_world'
    from '../common/src/gametest/nauvis_world'
    from('../common/src/generated/server/data/nauvis_terrain/worldgen/world_preset/nauvis.json') {
        into 'data/minecraft/worldgen/world_preset'
        rename { 'flat.json' }
    }
}
tasks.matching { it.name == 'prepareGameTestServerRun' }.configureEach { dependsOn gameTestPacks }
