pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// What every Minecraft version shares, then each version's: what its loaders share, and a mod per loader
// (docs/ARCHITECTURE.md, versions).
include 'core'
include 'mc-26.2:common', 'mc-26.2:neoforge', 'mc-26.2:fabric'
include 'mc-26.3:common', 'mc-26.3:neoforge', 'mc-26.3:fabric'
include 'mc-1.21.1:common', 'mc-1.21.1:neoforge', 'mc-1.21.1:fabric'
